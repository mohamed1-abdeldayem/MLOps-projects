[project]
name = "mlops-churn-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamed Abdeldayem", email = "mabdeldayem052@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "ipykernel>=7.3.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "pathlib>=1.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "skl2onnx>=1.20.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
mlops-churn-api = "mlops_churn_api:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
