services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn-api-container
    env_file:
      - .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: churn-frontend-container
    ports:
      - "5500:80"
    depends_on:
      - backend